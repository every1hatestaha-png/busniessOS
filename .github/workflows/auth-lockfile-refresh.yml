name: Refresh auth branch lockfile

on:
  push:
    branches:
      - architecture/auth-hardening-v1-1

permissions:
  contents: write

concurrency:
  group: auth-lockfile-refresh
  cancel-in-progress: true

jobs:
  refresh-lockfile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: architecture/auth-hardening-v1-1
      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: npm
      - name: Refresh Next.js lockfile only
        run: npm install next@16.3.8 --save-exact --package-lock-only --ignore-scripts
      - name: Verify exact safe Next.js resolution
        run: |
          node - <<'NODE'
          const pkg = require('./package.json')
          const lock = require('./package-lock.json')
          if (pkg.dependencies?.next !== '16.3.8') throw new Error('package.json Next.js is not pinned to 16.3.8')
          if (lock.packages?.['node_modules/next']?.version !== '16.3.8') throw new Error('lockfile Next.js is not 16.3.8')
          NODE
      - name: Commit refreshed dependency metadata
        shell: bash
        run: |
          if git diff --quiet -- package.json package-lock.json; then
            echo "Lockfile already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "security: upgrade Next.js to 16.3.8"
          git push origin HEAD:architecture/auth-hardening-v1-1
