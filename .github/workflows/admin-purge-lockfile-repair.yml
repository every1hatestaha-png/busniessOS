name: Admin purge dependency lockfile repair

on:
  push:
    branches: [fix/admin-tenant-purge-guards-20261024]
    paths: [.github/workflows/admin-purge-lockfile-repair.yml]

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/admin-tenant-purge-guards-20261024
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Update patched Electron in manifest and lockfile
        run: |
          npm install --package-lock-only --ignore-scripts --save-dev --save-exact electron@44.9.1
          node -e "const p=require('./package.json'); const l=require('./package-lock.json'); if(p.devDependencies.electron!=='44.9.1'||l.packages[''].devDependencies.electron!=='44.9.1'||l.packages['node_modules/electron'].version!=='44.9.1') process.exit(1)"
      - name: Commit lockfile repair to this PR branch only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json package-lock.json
          git diff --cached --quiet || (git commit -m 'security(deps): upgrade Electron to patched 44.9.1' && git push origin HEAD:fix/admin-tenant-purge-guards-20261024)
