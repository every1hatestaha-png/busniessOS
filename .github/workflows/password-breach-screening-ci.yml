name: Free-plan password breach screening security acceptance

on:
  push:
    branches:
      - security/free-password-breach-screening-20261011
  pull_request:
    branches:
      - fix/restaurant-qa-ui-integration-20261011

permissions:
  contents: read

jobs:
  password-screening:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: munshios_password_security_disposable
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d munshios_password_security_disposable"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15
    env:
      NODE_ENV: test
      RUN_PRISMA_MIGRATIONS_ON_BUILD: "0"
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/munshios_password_security_disposable?sslmode=disable
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_synthetic
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_live_fixture
      CLERK_SECRET_KEY: sk_live_fixture
      CLERK_OAUTH_CLIENT_ID: fixture-client
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
      - name: No preview deployment for work-in-progress auth security draft
        run: >-
          node -e 'const assert=require("node:assert/strict");
          const cfg=require("./vercel.json");
          assert.equal(cfg.git.deploymentEnabled["security/free-password-breach-screening-20261011"],false)'
      - run: npm ci --no-audit --no-fund
      - name: Full migrations on local disposable database
        run: |
          npx prisma validate
          npx prisma migrate deploy
          npx prisma migrate status
      - name: Pwned passwords privacy, signup and recovery tests
        run: >-
          npx vitest run
          tests/unit/password-breach-check.test.ts
          tests/unit/password-breach-route.test.ts
          tests/unit/auth-recovery-password-route.test.ts
          tests/unit/signup-email-otp-ui.test.ts
          tests/unit/auth-client-flows.test.ts
      - name: TypeScript safety
        run: npx tsc --noEmit
      - name: Changed-auth-code lint
        run: >-
          npx eslint
          lib/server/password-breach-check.ts
          app/api/auth/password-breach/route.ts
          app/sign-up/\[\[...sign-up\]\]/page.tsx
          app/auth/recovery/password/route.ts
          tests/unit/password-breach-check.test.ts
          tests/unit/password-breach-route.test.ts
          tests/unit/auth-recovery-password-route.test.ts
      - name: Production-mode no-migration build (no deploy)
        env:
          NODE_ENV: production
          VERCEL_ENV: production
        run: npm run build
