name: Restaurant V1.83 POS financial override gate

on:
  pull_request:
    branches:
      - architecture/restaurant-table-settlement-v1-82

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: munshios_restaurant_v183
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d munshios_restaurant_v183"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/munshios_restaurant_v183?sslmode=disable
      RUN_INTEGRATION_TESTS: "true"
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: npm
      - run: npm ci
      - run: npx prisma validate
      - run: npx prisma migrate deploy
      - name: POS financial authorization regressions
        run: >
          npx vitest run
          tests/unit/restaurant-adversarial-ui-v1-80.test.ts
          tests/integration/restaurant-pos-financial-approval-v1-11.test.ts
      - name: TypeScript
        run: npx tsc --noEmit
      - name: Diff hygiene
        run: git diff --check origin/architecture/restaurant-table-settlement-v1-82...HEAD
