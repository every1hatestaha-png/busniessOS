name: Finish production audit fixes

on:
  push:
    branches:
      - fix/production-audit-20260925
    paths:
      - .github/workflows/finish-production-audit.yml

permissions:
  contents: write

jobs:
  finish-fixes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply safe remaining fixes
        run: |
          set -euo pipefail
          perl -0pi -e 's/\{ contentSecurityPolicy: \{\} \},/\{ contentSecurityPolicy: \{ strict: true \} \},/' proxy.ts
          perl -0pi -e 's/<ClerkProvider afterSignOutUrl="\/sign-in" localization=\{clerkLocalization\}>/<ClerkProvider dynamic afterSignOutUrl="\/sign-in" localization=\{clerkLocalization\}>/' app/layout.tsx
          perl -0pi -e 's/ORDER BY "date" ASC, "createdAt" ASC/ORDER BY "date"::date ASC,\n        CASE WHEN "type" = '\''OPENING_BALANCE'\'' THEN 0 ELSE 1 END ASC,\n        "date" ASC, "createdAt" ASC, "id" ASC/' lib/server/customers.ts
          grep -Fq 'contentSecurityPolicy: { strict: true }' proxy.ts
          grep -Fq '<ClerkProvider dynamic' app/layout.tsx
          grep -Fq "CASE WHEN \"type\" = 'OPENING_BALANCE' THEN 0 ELSE 1 END ASC" lib/server/customers.ts
      - name: Commit and push
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add proxy.ts app/layout.tsx lib/server/customers.ts
          git commit -m 'Harden Clerk CSP and stabilize same-day ledger ordering'
          rm -f .github/workflows/finish-production-audit.yml
          git add -A
          git commit -m 'Remove temporary audit finishing workflow'
          git push origin HEAD:fix/production-audit-20260925
