name: MunshiOS release gate

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: munshios-production-release
  cancel-in-progress: false

jobs:
  release-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: munshios_release_gate
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d munshios_release_gate"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/munshios_release_gate?sslmode=disable
      NODE_ENV: test
      RUN_INTEGRATION_TESTS: "true"

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js version
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate Prisma schema
        run: npx prisma validate

      - name: Apply release-gate database migrations
        run: npx prisma migrate deploy

      - name: TypeScript gate
        run: npx tsc --noEmit

      - name: Production Next.js build gate
        env:
          NODE_ENV: production
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_Zml4dHVyZS5jbGVyay5hY2NvdW50cy5kZXYk
          CLERK_SECRET_KEY: sk_test_fixture
          CLERK_OAUTH_CLIENT_ID: fixture-client
        run: npm run build:web

      - name: Visual QA harness syntax gate
        run: |
          node --check tests/visual-qa/generate-documents.js
          node --check tests/visual-qa/visual-qa.cjs

      - name: Full unit and integration suite
        run: npm test

      - name: Finance-grade scenario suite
        run: npm run test:finance

      - name: ESLint gate
        run: npx eslint app components lib

      - name: Production dependency audit
        shell: bash
        run: |
          runtime_dir="$(mktemp -d)"
          node - "$runtime_dir/package.json" <<'NODE'
          const fs = require("node:fs");
          const source = require("./package.json");
          fs.writeFileSync(process.argv[2], JSON.stringify({
            name: "munshios-runtime-audit",
            version: source.version,
            private: true,
            dependencies: source.dependencies,
          }, null, 2));
          NODE
          cd "$runtime_dir"
          npx --yes npm@11.19.1 install --ignore-scripts --no-audit --no-fund --omit=peer
          npx --yes npm@11.19.1 audit --omit=peer --audit-level=high

  desktop-smoke:
    runs-on: windows-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/unused?sslmode=disable
      NODE_ENV: test

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js version
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Desktop smoke tests
        run: npm run desktop:test

  migrate-production:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    needs:
      - release-gate
      - desktop-smoke
    permissions:
      contents: read
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js version
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: npm

      - name: Install migration tooling
        run: npm ci --ignore-scripts

      - name: Assert production database target
        run: node scripts/assert-production-database-target.cjs

      - name: Use direct Neon connection for migrations
        shell: bash
        run: |
          node <<'NODE'
          const fs = require("node:fs");
          const raw = process.env.DATABASE_URL;
          if (!raw) throw new Error("DATABASE_URL is missing.");
          const url = new URL(raw);
          if (url.hostname.includes("-pooler.")) {
            url.hostname = url.hostname.replace("-pooler.", ".");
          }
          fs.appendFileSync(process.env.GITHUB_ENV, `DATABASE_URL=${url.toString()}\n`);
          NODE

      - name: Apply production database migrations
        shell: bash
        run: |
          set -o pipefail
          for attempt in 1 2 3; do
            set +e
            output="$(npx prisma migrate deploy 2>&1)"
            status=$?
            set -e
            printf '%s\n' "$output"

            if [ "$status" -eq 0 ]; then
              exit 0
            fi

            if ! printf '%s\n' "$output" | grep -Eq 'P1002|advisory lock'; then
              exit "$status"
            fi

            if [ "$attempt" -lt 3 ]; then
              echo "Prisma migration advisory lock is busy. Retrying after 15 seconds."
              sleep 15
            fi
          done

          echo "Production migration advisory lock remained unavailable after 3 attempts."
          exit 1

      - name: Verify no production migrations remain pending
        run: npx prisma migrate status

  verify-vercel-production:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    needs:
      - migrate-production

    steps:
      - name: Verify Vercel deployment revision and database readiness
        shell: bash
        env:
          READINESS_URL: https://business-os-one-gules.vercel.app/api/readiness
        run: |
          expected_revision="${GITHUB_SHA:0:12}"
          for attempt in {1..60}; do
            status="$(curl --silent --show-error --max-time 10 --output /tmp/munshios-readiness.json --write-out "%{http_code}" "$READINESS_URL" || true)"
            if [ "$status" = "200" ] && EXPECTED_REVISION="$expected_revision" node -e '
              const fs = require("node:fs");
              const body = JSON.parse(fs.readFileSync("/tmp/munshios-readiness.json", "utf8"));
              const ready = body.ok === true
                && body.database === "ready"
                && body.revision === process.env.EXPECTED_REVISION;
              process.exit(ready ? 0 : 1);
            '; then
              echo "MunshiOS Vercel revision and production database readiness verified."
              exit 0
            fi
            sleep 5
          done
          echo "MunshiOS Vercel production did not reach the expected revision and database readiness."
          if [ -f /tmp/munshios-readiness.json ]; then cat /tmp/munshios-readiness.json; fi
          exit 1
