# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy Node.js app to Azure Web App - munshiOS

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js version
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: npm

      - name: Install, build, and test
        run: |
          npm ci
          npm run build --if-present
          npm run test --if-present

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: .

  migrate-production:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js version
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: npm

      - name: Install migration tooling
        run: npm ci --ignore-scripts

      - name: Assert production database target
        run: node scripts/assert-production-database-target.cjs

      - name: Apply production database migrations
        run: npx prisma migrate deploy

      - name: Verify no production migrations remain pending
        run: npx prisma migrate status

  deploy:
    runs-on: ubuntu-latest
    needs:
      - build
      - migrate-production

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: node-app

      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'munshiOS'
          slot-name: 'Production'
          package: .
          publish-profile: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE_C8EC360977AC410C96E8E917AD9E5458 }}

      - name: Verify deployed runtime database readiness
        shell: bash
        run: |
          readiness_url="https://munshios-eaduhmhffefkbdgp.centralindia-01.azurewebsites.net/api/readiness"
          for attempt in {1..36}; do
            status="$(curl --silent --show-error --max-time 10 --output /tmp/munshios-readiness.json --write-out "%{http_code}" "$readiness_url" || true)"
            if [ "$status" = "200" ] && grep -q '"ok":true' /tmp/munshios-readiness.json; then
              echo "MunshiOS runtime database readiness verified."
              exit 0
            fi
            sleep 5
          done
          echo "MunshiOS runtime did not report database readiness after deployment."
          if [ -f /tmp/munshios-readiness.json ]; then cat /tmp/munshios-readiness.json; fi
          exit 1
