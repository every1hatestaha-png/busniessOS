name: Restaurant PR326 finance isolated PG18

on:
  pull_request:
    branches:
      - fix/staging-readiness-sterile-neon-20261011

permissions:
  contents: read

jobs:
  finance-49:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: munshios_finance_pr326_disposable
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d munshios_finance_pr326_disposable"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/munshios_finance_pr326_disposable?sslmode=disable
      NODE_ENV: test
      RUN_INTEGRATION_TESTS: "true"
      RUN_PRISMA_MIGRATIONS_ON_BUILD: "0"
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: synthetic-finance-publishable-key
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
      - name: Assert disposable database and no Vercel auto-deploy
        run: |
          node <<'NODE'
          const assert = require("node:assert/strict");
          const v = require("./vercel.json");
          assert.equal(v.git.deploymentEnabled["fix/restaurant-qa-ui-integration-20261011"], false);
          assert.equal(process.env.DATABASE_URL, "postgresql://postgres:postgres@127.0.0.1:5432/munshios_finance_pr326_disposable?sslmode=disable");
          assert.equal(process.env.RUN_PRISMA_MIGRATIONS_ON_BUILD, "0");
          console.log("Disposable runner-only PG18 confirmed. No Neon, staging or production credentials.");
          NODE
      - name: Install dependencies and generate Prisma client
        run: npm ci --no-audit --no-fund
      - name: Deploy existing migration catalogue to disposable PG18
        run: |
          npx prisma validate
          npx prisma migrate deploy
          npx prisma migrate status
      - name: Execute all finance grade tests
        run: npm run test:finance
