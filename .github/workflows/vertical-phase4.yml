name: Vertical architecture native PostgreSQL gate

on:
  pull_request:
    branches:
      - architecture/vertical-dashboard-navigation

permissions:
  contents: read

jobs:
  native-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: munshios_vertical_phase4
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d munshios_vertical_phase4"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/munshios_vertical_phase4?sslmode=disable
      RUN_INTEGRATION_TESTS: "true"
      NODE_ENV: test
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_Zml4dHVyZS5jbGVyay5hY2NvdW50cy5kZXYk
      CLERK_SECRET_KEY: sk_test_fixture
      CLERK_OAUTH_CLIENT_ID: fixture-client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: npm
      - run: npm ci
      - run: npx prisma validate
      - run: node scripts/vertical/entrypoints.cjs
      - name: Rehearse production-compatible chain and vertical migration
        shell: bash
        run: |
          set -euo pipefail
          migration="prisma/migrations/20260929124500_workspace_vertical_identity"
          staged="$(mktemp -d)/workspace_vertical_identity"
          mv "$migration" "$staged"
          trap 'if test -d "$staged"; then mv "$staged" "$migration"; fi' EXIT
          npx prisma migrate deploy
          node scripts/vertical/native-rehearsal.cjs seed
          mv "$staged" "$migration"
          npx prisma migrate deploy
          node scripts/vertical/native-rehearsal.cjs verify
          npx prisma migrate status
      - name: Full unit and database-backed regression suite
        run: npm test
      - name: Finance scenario suite
        run: npm run test:finance
      - run: npx tsc --noEmit
      - name: Production build
        env:
          NODE_ENV: production
        run: npm run build:web
