name: Final auth regression check

on:
  push:
    branches:
      - auth/supabase-migration

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: auth/supabase-migration
      - uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
          cache: npm
      - run: npm ci
      - name: Auth lint
        run: npx eslint lib/server/auth.ts app/auth/recovery/start/route.ts tests/unit/api-auth.test.ts
      - name: TypeScript
        run: npx tsc --noEmit
      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=high
      - name: Auth regression tests
        run: npx vitest run tests/unit/api-auth.test.ts tests/unit/auth-routing.test.ts tests/unit/auth-recovery-policy.test.ts tests/unit/authorization.test.ts tests/unit/cors.test.ts tests/unit/members.test.ts
