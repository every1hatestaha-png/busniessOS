name: One Shot Sales Performance Hardening

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-sales-performance.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Batch sale line writes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('lib/server/sales.ts')
          s = p.read_text()
          old = '''    let costOfGoodsSold = new Prisma.Decimal(0);\n\n    for (const line of lines) {\n      const product = products.find((entry) => entry.id === line.productId)!;\n      costOfGoodsSold = costOfGoodsSold.plus(product.costPrice.mul(line.quantity));\n      const changed = await tx.product.updateMany({ where: { id: line.productId, workspaceId: context.workspaceId, stockQuantity: { gte: line.quantity } }, data: { stockQuantity: { decrement: line.quantity } } });\n      if (changed.count !== 1) throw new SaleDomainError("INSUFFICIENT_STOCK", `Unable to create sale because ${product.name} does not have sufficient inventory. Available quantity: ${product.stockQuantity.toString()}.`);\n      await tx.salesOrderItem.create({ data: { salesOrderId: order.id, productId: line.productId, productName: product.name, productSku: product.sku, quantity: line.quantity, unitPrice: line.unitPrice, discountPerUnit: line.discountPerUnit, totalPrice: line.total, pricingMode: line.pricingMode, unitWeight: line.pricingMode === "WEIGHT" ? line.unitWeight : null, totalWeight: line.totalWeight, perKgRate: line.pricingMode === "WEIGHT" ? line.perKgRate : null } });\n      await tx.inventoryTransaction.create({ data: { workspaceId: context.workspaceId, productId: line.productId, type: "SALE", quantityChanged: -line.quantity, unitCost: product.costPrice, reference: orderNumber } });\n    }\n'''
          new = '''    let costOfGoodsSold = new Prisma.Decimal(0);\n    const productById = new Map(products.map((product) => [product.id, product]));\n\n    // Keep the guarded stock decrements serialized so overselling remains impossible,\n    // then batch the append-only line and inventory writes to reduce transaction round trips.\n    for (const line of lines) {\n      const product = productById.get(line.productId)!;\n      costOfGoodsSold = costOfGoodsSold.plus(product.costPrice.mul(line.quantity));\n      const changed = await tx.product.updateMany({ where: { id: line.productId, workspaceId: context.workspaceId, stockQuantity: { gte: line.quantity } }, data: { stockQuantity: { decrement: line.quantity } } });\n      if (changed.count !== 1) throw new SaleDomainError("INSUFFICIENT_STOCK", `Unable to create sale because ${product.name} does not have sufficient inventory. Available quantity: ${product.stockQuantity.toString()}.`);\n    }\n\n    await tx.salesOrderItem.createMany({ data: lines.map((line) => {\n      const product = productById.get(line.productId)!;\n      return { salesOrderId: order.id, productId: line.productId, productName: product.name, productSku: product.sku, quantity: line.quantity, unitPrice: line.unitPrice, discountPerUnit: line.discountPerUnit, totalPrice: line.total, pricingMode: line.pricingMode, unitWeight: line.pricingMode === "WEIGHT" ? line.unitWeight : null, totalWeight: line.totalWeight, perKgRate: line.pricingMode === "WEIGHT" ? line.perKgRate : null };\n    }) });\n    await tx.inventoryTransaction.createMany({ data: lines.map((line) => {\n      const product = productById.get(line.productId)!;\n      return { workspaceId: context.workspaceId, productId: line.productId, type: "SALE" as const, quantityChanged: -line.quantity, unitCost: product.costPrice, reference: orderNumber };\n    }) });\n'''
          if old not in s:
              raise SystemExit('sales write block not found')
          s = s.replace(old, new, 1)
          p.write_text(s)
          PY

          rm .github/workflows/one-shot-sales-performance.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/server/sales.ts .github/workflows/one-shot-sales-performance.yml
          git commit -m "perf: batch append-only sale transaction writes"
          git push origin main
