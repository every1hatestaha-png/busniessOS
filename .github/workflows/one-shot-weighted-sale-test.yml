name: One Shot Weighted Sale Test

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-weighted-sale-test.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Add weighted sale regression
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('tests/integration/sales-payments.test.ts')
          s = p.read_text()
          old = 'let getReceivablesAging: typeof import("@/lib/server/receivables")["getReceivablesAging"];'
          new = old + '\nlet getInvoice: typeof import("@/lib/server/invoices")["getInvoice"];'
          if old not in s: raise SystemExit('declaration anchor not found')
          s = s.replace(old, new, 1)
          old = '    ({ getReceivablesAging } = await import("@/lib/server/receivables"));'
          new = old + '\n    ({ getInvoice } = await import("@/lib/server/invoices"));'
          if old not in s: raise SystemExit('import anchor not found')
          s = s.replace(old, new, 1)
          anchor = '  it("rolls back the entire sale when stock is insufficient", async () => {'
          test = '''  it("persists overridden actual weight and exposes it on sale and invoice DTOs", async () => {\n    const product = await db.product.create({ data: { workspaceId: workspaceA, name: `Weighted sale ${runId}`, sku: `weighted-sale-${runId}`, costPrice: 400, sellingPrice: 300, stockQuantity: 10, defaultWeightKg: 4.5 } });\n    const result = await createSale(context(workspaceA), {\n      customerId: customerA,\n      items: [{ productId: product.id, quantity: 3, pricingMode: "WEIGHT", unitWeight: 4.72, perKgRate: 285, unitPrice: 1, discountPerUnit: 5 }],\n      orderDiscount: 0,\n      paidAmount: 0,\n      notes: "Variable actual weight regression",\n      idempotencyKey: randomUUID(),\n    });\n\n    const [stored, sale, invoiceRow] = await Promise.all([\n      db.salesOrderItem.findFirstOrThrow({ where: { salesOrderId: result.id, productId: product.id } }),\n      getSale(workspaceA, result.id),\n      db.invoice.findUniqueOrThrow({ where: { salesOrderId: result.id }, select: { id: true } }),\n    ]);\n    const invoice = await getInvoice(workspaceA, invoiceRow.id);\n\n    expect(stored.pricingMode).toBe("WEIGHT");\n    expect(Number(stored.unitWeight)).toBe(4.72);\n    expect(Number(stored.totalWeight)).toBe(14.16);\n    expect(Number(stored.perKgRate)).toBe(285);\n    expect(Number(stored.unitPrice)).toBeCloseTo(1345.2, 2);\n    expect(sale?.items[0]).toMatchObject({ pricingMode: "WEIGHT", unitWeight: 4.72, totalWeight: 14.16, perKgRate: 285 });\n    expect(invoice?.order?.items[0]).toMatchObject({ pricingMode: "WEIGHT", unitWeight: 4.72, totalWeight: 14.16, perKgRate: 285 });\n  });\n\n'''
          if anchor not in s: raise SystemExit('test insertion anchor not found')
          s = s.replace(anchor, test + anchor, 1)
          p.write_text(s)
          PY
          rm .github/workflows/one-shot-weighted-sale-test.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/integration/sales-payments.test.ts .github/workflows/one-shot-weighted-sale-test.yml
          git commit -m "test: lock variable-weight sale snapshots"
          git push origin main
