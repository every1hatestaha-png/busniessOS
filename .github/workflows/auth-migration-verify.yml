name: Auth migration verification

on:
  push:
    branches:
      - auth/supabase-migration

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: auth/supabase-migration

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint auth migration files
        run: >-
          npx eslint
          app/auth/callback/route.ts
          app/auth/recovery/start/route.ts
          app/forgot-password/page.tsx
          'app/sign-in/[[...sign-in]]/page.tsx'
          'app/sign-up/[[...sign-up]]/page.tsx'
          app/recovery/new-password/page.tsx
          lib/server/auth.ts
          lib/server/api.ts
          lib/supabase/client.ts
          lib/supabase/server.ts
          components/layout/web-account-menu.tsx
          components/layout/desktop-clerk-account-menu.tsx
          components/layout/top-nav.tsx
          app/layout.tsx
          app/platform/layout.tsx
          proxy.ts

      - name: TypeScript
        run: npx tsc --noEmit

      - name: Tests
        run: npm test

      - name: Dependency audit
        run: npm audit --omit=dev --audit-level=high
