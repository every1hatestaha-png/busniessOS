name: Auth security lockfile repair

on:
  push:
    branches:
      - auth/supabase-migration

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: auth/supabase-migration
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
          cache: npm

      - name: Regenerate lockfile with security overrides
        run: npm install --package-lock-only --ignore-scripts

      - name: Validate Prisma generate and clean install
        run: |
          npm ci
          npx prisma generate

      - name: Verify production dependency audit
        run: npm audit --omit=dev --audit-level=high

      - name: Commit repaired lockfile if needed
        shell: bash
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json is already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "Apply auth dependency security overrides"
          git push origin HEAD:auth/supabase-migration
