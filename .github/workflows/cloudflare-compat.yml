name: Cloudflare Compatibility Audit

on:
  workflow_dispatch:
  push:
    branches:
      - audit/cloudflare-vinext-compat
  pull_request:
    paths:
      - "app/**"
      - "components/**"
      - "lib/**"
      - "next.config.*"
      - "package.json"
      - "package-lock.json"
      - "proxy.ts"
      - ".github/workflows/cloudflare-compat.yml"

permissions:
  contents: read

jobs:
  vinext-compat:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Check vinext compatibility
        run: npx --yes vinext@latest check
      - name: Preview Wrangler automatic configuration
        run: npx --yes wrangler@latest setup --dry-run --yes
