name: Restaurant V1.88 query performance gate

on:
  pull_request:
    branches:
      - architecture/restaurant-independent-audit-v1-86

permissions:
  contents: read

jobs:
  certification:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: munshios_restaurant_v188
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d munshios_restaurant_v188"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/munshios_restaurant_v188?sslmode=disable
      RUN_INTEGRATION_TESTS: "true"
      NODE_ENV: test
      AUDIT_BASE: 7fcf9e2687396f73f1f303b0ab8549ee3b564870
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: npm
      - name: Safety and ancestry
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$AUDIT_BASE" HEAD
          git diff --check "$AUDIT_BASE...HEAD"
          git diff --quiet "$AUDIT_BASE...HEAD" -- .github/workflows/main_munshios.yml
          node <<'NODE'
          const fs=require("node:fs");
          const cfg=JSON.parse(fs.readFileSync("vercel.json","utf8"));
          if (cfg.git?.deploymentEnabled?.["architecture/restaurant-query-performance-v1-88"] !== false) {
            throw new Error("V1.88 Vercel deployment must remain disabled.");
          }
          NODE
      - run: npm ci
      - run: npm audit --audit-level=moderate
      - run: npx prisma validate
      - name: Full migration chain
        run: |
          npx prisma migrate deploy
          npx prisma migrate status
      - name: V1.88 focused regression
        run: npx vitest run tests/integration/restaurant-query-performance-v1-88.test.ts
      - name: Full Restaurant and warehouse regression
        run: >
          npx vitest run
          tests/integration/restaurant-*.test.ts
          tests/unit/restaurant-*.test.ts
          tests/integration/warehouse-stock-tenant-tuple-integrity-v1-50.test.ts
          tests/integration/managed-warehouse-stock.test.ts
      - name: Full application suite
        run: npm test
      - name: Finance
        run: npm run test:finance
      - name: TypeScript
        run: npx tsc --noEmit
      - name: Changed-file lint
        run: >
          npx eslint
          "app/(dashboard)/restaurant/orders/page.tsx"
          lib/server/restaurant-integrity.ts
          lib/server/restaurant-payment-summary.ts
          tests/integration/restaurant-query-performance-v1-88.test.ts
      - name: Production web build
        env:
          NODE_ENV: production
        run: npm run build:web

  query-plan-certification:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: munshios_restaurant_v188_perf
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d munshios_restaurant_v188_perf"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/munshios_restaurant_v188_perf?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: npm
      - run: npm ci
      - run: npx prisma migrate deploy
      - name: Verify bounded operational query plans
        run: node scripts/restaurant-query-plan-certification-v1-88.cjs

  karachi-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/munshios_restaurant_v188_karachi?sslmode=disable
      RUN_INTEGRATION_TESTS: "true"
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: npm
      - run: npm ci
      - name: Create Asia Karachi database
        shell: bash
        run: |
          export PGPASSWORD=postgres
          psql -h 127.0.0.1 -U postgres -d postgres -v ON_ERROR_STOP=1 -c 'CREATE DATABASE munshios_restaurant_v188_karachi'
          psql -h 127.0.0.1 -U postgres -d postgres -v ON_ERROR_STOP=1 -c "ALTER DATABASE munshios_restaurant_v188_karachi SET timezone TO 'Asia/Karachi'"
      - run: npx prisma migrate deploy
      - name: Restaurant suite under Asia Karachi
        run: >
          npx vitest run
          tests/integration/restaurant-*.test.ts
          tests/unit/restaurant-*.test.ts
      - run: npx tsc --noEmit
