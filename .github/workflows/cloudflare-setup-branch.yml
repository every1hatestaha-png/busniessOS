name: Generate Cloudflare Workers Setup

on:
  push:
    branches:
      - setup/cloudflare-workers

permissions:
  contents: write

jobs:
  configure:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: setup/cloudflare-workers
      - name: Stop if already configured
        id: configured
        shell: bash
        run: |
          if [ -f wrangler.jsonc ] || [ -f wrangler.toml ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Setup Node
        if: steps.configured.outputs.exists == 'false'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install current dependencies
        if: steps.configured.outputs.exists == 'false'
        run: npm ci
      - name: Generate Workers configuration
        if: steps.configured.outputs.exists == 'false'
        run: npx --yes wrangler@latest setup --yes
      - name: Validate generated vinext build
        if: steps.configured.outputs.exists == 'false'
        run: |
          npm run build:vinext
          npx --yes vinext@latest check
      - name: Show generated changes
        if: steps.configured.outputs.exists == 'false'
        run: git status --short && git diff -- package.json next.config.ts .gitignore .assetsignore wrangler.jsonc vite.config.ts
      - name: Commit generated setup
        if: steps.configured.outputs.exists == 'false'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Configure Cloudflare Workers with vinext [skip ci]"
          git push origin HEAD:setup/cloudflare-workers
