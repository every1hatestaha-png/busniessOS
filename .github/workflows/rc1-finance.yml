name: RC1 Finance Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: rc1-finance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  finance-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: munshios_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d munshios_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/munshios_test?sslmode=disable
      NODE_ENV: test
      RUN_INTEGRATION_TESTS: "true"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate Prisma schema
        run: npx prisma validate

      - name: Apply database migrations
        run: npx prisma migrate deploy

      - name: TypeScript gate
        run: npx tsc --noEmit

      - name: Full unit and integration suite
        run: npm test

      - name: ESLint gate
        run: npx eslint app components lib

      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=high

  desktop-smoke:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/unused?sslmode=disable
      NODE_ENV: test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Desktop smoke tests
        run: npm run desktop:test
