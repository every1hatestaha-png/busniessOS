name: Restaurant station workflows isolated CI

on:
  push:
    branches:
      - feat/restaurant-station-workflows-v2-00
      - feat/restaurant-staff-stations-v2-01
      - fix/restaurant-audit-findings-v2-02
  pull_request:
    branches:
      - fix/legal-explicit-consent-v1-99

permissions:
  contents: read

jobs:
  isolated-restaurant-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: restaurant_station_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d restaurant_station_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/restaurant_station_ci?sslmode=disable
      NODE_ENV: test
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_synthetic_restaurant_station
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npx prisma validate
      - name: Rehearse full Prisma migration chain on disposable PostgreSQL 18
        run: |
          npx prisma migrate deploy
          npx prisma migrate status
      - name: Restaurant POS, kitchen and staff station regressions
        shell: bash
        run: |
          set -euo pipefail
          files=(tests/unit/restaurant-pos-fast-entry.test.ts tests/unit/restaurant-kitchen-line-items.test.ts)
          if test -f tests/unit/restaurant-kitchen-queue-lanes.test.ts; then
            files+=(tests/unit/restaurant-kitchen-queue-lanes.test.ts)
          fi
          if test -f tests/unit/restaurant-legacy-station-boundaries.test.ts; then
            files+=(tests/unit/restaurant-legacy-station-boundaries.test.ts)
          fi
          if test -f tests/unit/restaurant-staff-stations.test.ts; then
            files+=(tests/unit/restaurant-staff-stations.test.ts)
          fi
          npx vitest run "${files[@]}"
      - name: Full unit regressions
        run: npm test
      - name: Restaurant replay, tenant and access integration
        env:
          RUN_INTEGRATION_TESTS: "true"
        run: >
          npx vitest run
          tests/integration/restaurant-pos-replay-v1-90.test.ts
          tests/integration/restaurant-access-policy-v1-91.test.ts
      - name: TypeScript safety
        run: npx tsc --noEmit
