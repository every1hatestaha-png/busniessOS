name: Restaurant PR326 full isolated integration PG18

on:
  pull_request:
    branches:
      - fix/staging-readiness-sterile-neon-20261011

permissions:
  contents: read

jobs:
  restaurant-isolated:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: restaurant_pr326_disposable
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d restaurant_pr326_disposable"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/restaurant_pr326_disposable?sslmode=disable
      NODE_ENV: test
      RUN_INTEGRATION_TESTS: "true"
      RUN_PRISMA_MIGRATIONS_ON_BUILD: "0"
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: synthetic-publishable-key
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_live_fixture
      CLERK_SECRET_KEY: sk_live_fixture
      CLERK_OAUTH_CLIENT_ID: fixture-client
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
      - name: Verify disposable DB and staging deployment disabled
        run: |
          node <<'NODE'
          const assert = require("node:assert/strict");
          const {git} = require("./vercel.json");
          assert.equal(git.deploymentEnabled["fix/restaurant-qa-ui-integration-20261011"], false);
          const url = new URL(process.env.DATABASE_URL);
          assert.equal(url.hostname, "127.0.0.1");
          assert.equal(url.pathname, "/restaurant_pr326_disposable");
          assert.equal(process.env.RUN_PRISMA_MIGRATIONS_ON_BUILD, "0");
          console.log("Using isolated local PostgreSQL 18 service only.");
          NODE
      - name: Install and generate Prisma client
        run: npm ci --no-audit --no-fund
      - name: Apply migrations to disposable PG18
        run: |
          npx prisma validate
          npx prisma migrate deploy
          npx prisma migrate status
      - name: Full Restaurant and warehouse integrity regressions
        run: >-
          npx vitest run
          tests/integration/restaurant-*.test.ts
          tests/unit/restaurant-*.test.ts
          tests/integration/warehouse-stock-tenant-tuple-integrity-v1-50.test.ts
          tests/integration/managed-warehouse-stock.test.ts
      - name: Isolated staging, auth and request-boundary regressions
        run: >-
          npx vitest run
          tests/unit/staging-database-guard.test.ts
          tests/unit/staging-database-target.test.ts
          tests/unit/preview-acceptance-target.test.ts
          tests/unit/staging-release-target.test.ts
          tests/unit/restaurant-release-build-guard-v1-88.test.ts
          tests/unit/rc132-protected-preview-smoke.test.ts
          tests/unit/web-mutation-csrf.test.ts
          tests/unit/web-mutation-route-coverage.test.ts
          tests/unit/proxy-web-mutation-boundaries.test.ts
