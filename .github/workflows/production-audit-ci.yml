name: Production audit CI

on:
  push:
    branches:
      - fix/production-audit-20260925
  pull_request:
    branches:
      - main

permissions:
  contents: read

env:
  DATABASE_URL: postgresql://audit:audit@127.0.0.1:5432/audit?sslmode=disable
  NEXT_PUBLIC_APP_URL: https://www.munshios.tech

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma validate
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: npm test
      - run: npm run test:finance
      - run: npm run desktop:test
      - run: npm run build
      - name: Dependency audit
        run: npm audit --omit=dev --audit-level=high
