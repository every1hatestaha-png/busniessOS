name: One Shot Runtime Polish

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-runtime-polish.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Remove temporary D4 web logs and add dashboard loading state
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          paths = [Path('lib/server/auth.ts'), Path('proxy.ts'), Path('app/page.tsx'), Path('app/(dashboard)/layout.tsx'), Path('app/(dashboard)/dashboard/page.tsx')]
          for p in paths:
            if not p.exists(): continue
            lines = p.read_text().splitlines()
            lines = [line for line in lines if not ('console.info(' in line and '[D4]' in line)]
            p.write_text('\n'.join(lines) + '\n')
          PY

          cat > 'app/(dashboard)/loading.tsx' <<'EOF'
          export default function DashboardLoading() {
            return (
              <div className="mx-auto w-full max-w-[1600px] animate-pulse space-y-5" aria-label="Loading page">
                <div className="space-y-2">
                  <div className="h-7 w-52 rounded bg-slate-200" />
                  <div className="h-4 w-80 max-w-full rounded bg-slate-100" />
                </div>
                <div className="grid gap-4 sm:grid-cols-2 xl:grid-cols-4">
                  {Array.from({ length: 4 }).map((_, index) => <div key={index} className="h-24 rounded-lg border bg-white p-4"><div className="h-3 w-20 rounded bg-slate-100" /><div className="mt-4 h-6 w-28 rounded bg-slate-200" /></div>)}
                </div>
                <div className="h-72 rounded-lg border bg-white p-5"><div className="h-4 w-32 rounded bg-slate-200" /><div className="mt-5 space-y-3">{Array.from({ length: 5 }).map((_, index) => <div key={index} className="h-9 rounded bg-slate-50" />)}</div></div>
              </div>
            );
          }
          EOF

          rm .github/workflows/one-shot-runtime-polish.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/server/auth.ts proxy.ts app/page.tsx 'app/(dashboard)/layout.tsx' 'app/(dashboard)/dashboard/page.tsx' 'app/(dashboard)/loading.tsx' .github/workflows/one-shot-runtime-polish.yml
          git commit -m "perf: remove debug log noise and show instant route feedback"
          git push origin main
